<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
    <title>StudentHub Genesis</title>
    <link rel="icon" type="image/png" href="iste.jpg">
</head>

<body class="background">
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="iste.jpg" alt="" width="100">
                </img>
            </a>
        </div>
        <div class="nighmode">
            <button id="darkmode">☀️</button>
        </div>
        <nav>
            <h1 class="main-text">StudentHub project
                <hr class="lines">

                <div class="nav">
                    <a class="box" href="index.html">Home</a>
                    <a class="box" href="about.html">About</a>
                </div>

                <hr class="lines">
        </nav>
        </h1>
    </header>
    <main>
        <div class="main-text">
            <h1 style="text-align: center;">
                Student Details
            </h1>
            <div class="profile-container">
                <div class="profile-card">
                    <h2 style=" text-align: start;">
                        <p id="username"></p>
                        <p id="email"></p>
                        <button style="margin-left: 328px;border-radius: 10px;background-color: red;color: yellow;"
                            id="logout">Logout</button>

                    </h2>
                </div>
            </div>

        </div>
        <div class="dashboard-cards">
            <div class="task-manager">
                <h1 class="main-text">Task Manager</h1>
                <input style="margin-left: 60px;" text" id="taskInput" placeholder="Enter a task">
                <button style="border-radius: 5px;" id="addTask">Add Task</button>
                <div id="tasklist"></div>

            </div>
            <div class="bookmark">
                <h2 class="main-text">Quick Links</h2>
                <div class="quick-links">
                    <input type="text" id="websiteName" placeholder="Website Name">
                    <input type="link" id="websiteURL" placeholder="https://example.com">
                    <button id="addLink">Add Website</button>
                </div>
                <div id="bookmarkList"></div>

            </div>
        </div>
        <script src="index.js"></script>
        <script src="dashboard.js"></script>
    </main>
    <footer>

    </footer>



</body>

</html>
