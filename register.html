<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
    <title>StudentHub Genesis</title>
    <link rel="icon" type="image/png" href="iste.jpg">
</head>

<body class="background">
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="iste.jpg" alt="" width="100">
                </img>
            </a>
        </div>
        <div class="nighmode">
            <button id="darkmode">☀️</button>
        </div>
        <h1 class="main-text">StudentHub project
            <hr style="border-color:blue;">
        </h1>
    </header>
    <main>
        <form id="regform">
            <table align="center" class="reg-box">
                <tr>
                    <td><B class="values">Email address</B></td>
                    <td><input type="email" id="email" /></td>
                </tr>
                <tr>
                    <td><B class="values">User-Name</B></td>
                    <td><input type="text" id="username" /></td>
                </tr>
                <tr class="tabel">
                    <td><B class="values">Password</B></td>
                    <td><input type="password" id="password" /></td>

                </tr>

                <tr>
                    <td><button style="font-size: 10px;" id="generate" type="button"> generate a custom
                            password</button></td>

                    <td>
                        <input type="submit" value="login">
                    </td>

                </tr>
            </table>
        </form>
        <script src="register.js"></script>
        <script src="index.js"></script>
        <script src="password_genrator.js"></script>
    </main>
    <footer>

    </footer>



</body>

</html>
